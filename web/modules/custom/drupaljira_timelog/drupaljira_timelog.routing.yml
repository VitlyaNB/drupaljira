entity.time_log.collection:
  path: '/admin/structure/time-log'
  defaults:
    _entity_list: 'time_log'
    _title: 'Time Logs'
  requirements:
    _permission: 'administer time log entities'

drupaljira.timelog_debug.crud:
  path: '/admin/drupaljira/timelog-debug/crud/{task}'
  defaults:
    _controller: '\Drupal\drupaljira_timelog\Controller\TimeLogDebugController::crud'
    _title: 'TimeLog Debug: CRUD'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      task:
        type: 'entity:node'

drupaljira.timelog_debug.list:
  path: '/admin/drupaljira/timelog-debug/list/{task}'
  defaults:
    _controller: '\Drupal\drupaljira_timelog\Controller\TimeLogDebugController::list'
    _title: 'TimeLog Debug: List'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      task:
        type: 'entity:node'

drupaljira.timelog_debug.sum:
  path: '/admin/drupaljira/timelog-debug/sum/{task}'
  defaults:
    _controller: '\Drupal\drupaljira_timelog\Controller\TimeLogDebugController::sum'
    _title: 'TimeLog Debug: Sum'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      task:
        type: 'entity:node'
